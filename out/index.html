<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BarangayResolve</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1e3a8a;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        text-align: center;
        padding: 24px;
        max-width: 30rem;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 8px;
        font-size: 14px;
        opacity: 0.85;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin: 12px 0;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #475569;
        font-size: 14px;
      }
      button {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 0;
        background: #1d4ed8;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
        opacity: 0.9;
      }
      a {
        color: #bfdbfe;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BarangayResolve</h1>
      <p id="hint">Enter the address of your BarangayResolve server.</p>
      <form id="form" hidden>
        <input
          id="url"
          type="url"
          inputmode="url"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="https://your-tunnel.trycloudflare.com"
        />
        <button type="submit">Connect</button>
      </form>
      <p id="status"></p>
      <p><a id="fallback" href="http://localhost:3000">Open in browser instead</a></p>
    </main>

    <script>
      // The native app boots this bundled page, then hands off to the live
      // server. Quick-tunnel URLs change on every restart, so the address is
      // stored on the device rather than compiled into the APK.
      (function () {
        var KEY = "barangayresolve.serverUrl";
        var form = document.getElementById("form");
        var input = document.getElementById("url");
        var status = document.getElementById("status");
        var hint = document.getElementById("hint");

        function normalize(value) {
          var v = (value || "").trim();
          if (!v) return "";
          if (!/^https?:\/\//i.test(v)) v = "https://" + v;
          return v.replace(/\/+$/, "");
        }

        function go(raw) {
          var url = normalize(raw);
          if (!/^https?:\/\//i.test(url)) return false;
          window.location.replace(url);
          return true;
        }

        function saved() {
          try {
            return localStorage.getItem(KEY);
          } catch (e) {
            return null;
          }
        }

        function store(url) {
          try {
            localStorage.setItem(KEY, normalize(url));
          } catch (e) {
            /* ignore */
          }
        }

        var current = saved();
        if (current) {
          go(current);
          return;
        }

        form.hidden = false;
        hint.textContent = "Enter the address of your BarangayResolve server.";

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          if (go(input.value)) {
            store(input.value);
            status.textContent = "Connecting...";
          } else {
            status.textContent = "That does not look like a valid address.";
          }
        });
      })();
    </script>
  </body>
</html>
