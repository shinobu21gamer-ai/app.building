version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Group all the updates in a single PR, except sensitive packages
      # (typescript/astro) that get their own PR for manual review, since
      # major bumps there have broken `astro check` in the past.
      all-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "astro"
          - "@astrojs/*"
          # Prisma 7 removes `datasource url` from schema files (P1012 breaks
          # `prisma generate`) and its client requires a driver adapter, which
          # this app does not use yet. Stay on the pinned Prisma 6 line; a
          # Prisma 7 upgrade is a deliberate migration, not an auto-bump.
          - "prisma"
          - "@prisma/client"
