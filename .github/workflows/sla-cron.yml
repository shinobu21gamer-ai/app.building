name: Scheduled jobs

# The jobs the app owes the resident on a clock:
#   * the pending/failed email retry, every 15 minutes — a resident's progress
#     update should not sit stuck behind one transient SMTP hiccup;
#   * the 48-hour escalation scan, hourly (20 minutes past the hour, so it never
#     collides with the top-of-hour traffic of other schedulers);
#   * the audit chain verification and digest, weekly on Sunday;
#   * the retention sweep, daily at 03:10 UTC (11:10 in Manila) — after the
#     nightly backups and before the working day, so a disposal is in the
#     morning's archive and never in a resident's way.
#
# They all call the app's own cron routes with CRON_SECRET, so the work happens
# inside the application (transactions, audit chain, notifications) instead of
# in a shell script.
#
# Configuration:
#   secret CRON_SECRET   — same value as the deployment's CRON_SECRET
#   variable APP_BASE_URL — the public origin, e.g. https://barangayresolve.app
# Without both, each job says so and exits green instead of failing every hour.

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "20 * * * *"
    - cron: "50 * * * *"
    - cron: "40 1 * * 0"
    - cron: "10 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  email-deliveries:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Retry pending and failed email deliveries
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_BASE_URL" ]; then
            echo "::warning::CRON_SECRET secret and/or APP_BASE_URL variable is not set — skipping the email delivery retry."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "$APP_BASE_URL/api/v1/cron/email-deliveries" \
            -H "Authorization: Bearer $CRON_SECRET"

  sla-escalations:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run the escalation job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_BASE_URL" ]; then
            echo "::warning::CRON_SECRET secret and/or APP_BASE_URL variable is not set — skipping the escalation job."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "$APP_BASE_URL/api/v1/cron/sla-escalations" \
            -H "Authorization: Bearer $CRON_SECRET"

  login-security-reports:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '50 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Remind admins about overdue sign-in reports
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_BASE_URL" ]; then
            echo "::warning::CRON_SECRET secret and/or APP_BASE_URL variable is not set — skipping the sign-in report reminder."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "$APP_BASE_URL/api/v1/cron/login-security-reports" \
            -H "Authorization: Bearer $CRON_SECRET"

  audit-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '40 1 * * 0'
    runs-on: ubuntu-latest
    steps:
      - name: Verify the audit chain
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_BASE_URL" ]; then
            echo "::warning::CRON_SECRET secret and/or APP_BASE_URL variable is not set — skipping the audit verification."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 300 \
            -X POST "$APP_BASE_URL/api/v1/cron/audit-verify" \
            -H "Authorization: Bearer $CRON_SECRET"

  retention-sweep:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '10 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run the retention sweep
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_BASE_URL" ]; then
            echo "::warning::CRON_SECRET secret and/or APP_BASE_URL variable is not set — skipping the retention sweep."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 300 \
            -X POST "$APP_BASE_URL/api/v1/cron/retention" \
            -H "Authorization: Bearer $CRON_SECRET"
