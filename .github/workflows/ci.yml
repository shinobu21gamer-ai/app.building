name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Prisma reads this during client generation; the build does not connect to it.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      # The APK is a thin WebView that loads server.url from
      # android/app/src/main/assets/capacitor.config.json. That file and
      # capacitor.plugins.json are generated by `cap sync` and committed on
      # purpose; this guard fails the build when they no longer match
      # capacitor.config.ts or the installed plugin set.
      - name: Verify Android Capacitor assets are in sync
        run: |
          mkdir -p android/app/src/main/assets
          npx cap sync android
          git diff --exit-code -- android

  # The report loaders and the retention sweep are the only layer whose bugs live
  # in SQL instead of in arithmetic: the unit suite exercises them with fixture
  # objects, which cannot catch a wrong join, a missing filter or a column that
  # does not exist. This job applies the hand-written migrations to a real
  # PostgreSQL and runs `tests/db/**`, which the default vitest config excludes so
  # a checkout without a database still has a green suite.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        # Without the health check the migration step races the server's start.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `prisma migrate deploy` only replays the committed migrations; a migration
      # that does not apply is a deploy failure caught here rather than on Vercel.
      - name: Apply the migrations to a real database
        run: npx prisma migrate deploy

      - name: Database-backed tests
        run: npx vitest run --config vitest.db.config.mts

  # The Android shell cannot be tested from the web build, and a mistake in it
  # only shows up as a phone app that closes without a message. Compiling the
  # real APK on every change is the only cheap way to catch that before it is
  # handed to a user.
  android:
    runs-on: ubuntu-latest
    env:
      # `npm ci` runs prisma generate (postinstall), which only needs this to be set.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # android/app/google-services.json is gitignored (it carries an API key),
      # so CI supplies a structurally valid placeholder: enough for the Google
      # Services Gradle plugin to run and for the whole shell to compile. CI
      # artifacts are never shipped, and the real file is used for release APKs.
      - name: Provide a placeholder Firebase configuration
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "barangayresolve-ci",
              "storage_bucket": "barangayresolve-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.barangayresolve.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      # Builds through the same script users run: it syncs Capacitor first,
      # repairs the gradlew executable bit and refuses to hand out an APK with no
      # Firebase configuration. The output is captured so a failure is readable
      # in the run summary instead of only behind a log download.
      - name: Assemble the debug APK
        run: |
          set -o pipefail
          if npm run android:apk > android-build.log 2>&1; then
            tail -20 android-build.log
          else
            echo "::error::$(tail -c 900 android-build.log | tr '\n' ' ')"
            tail -80 android-build.log
            exit 1
          fi
